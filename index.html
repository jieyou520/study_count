<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="一个按 3-5 分钟专注、10 秒闭眼回顾、90 分钟学习目标和 20 分钟长休运行的本地学习计时器。">
<title>Study Count · 专注循环计时器</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#303845; --txt:#e6edf3; --dim:#9aa4b2;
  --focus:#4ea1ff; --recall:#39d98a; --long:#f5a524;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:radial-gradient(1100px 650px at 50% -12%, #172033 0%, var(--bg) 62%);
  color:var(--txt);
  font:16px/1.5 -apple-system,"Segoe UI","Noto Sans SC",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:clamp(20px,5vw,44px);
  user-select:none;-webkit-tap-highlight-color:transparent;
}
h1{
  margin:0;color:var(--dim);font-size:15px;font-weight:650;
  letter-spacing:0;text-align:center;
}
.phase{
  min-height:33px;font-size:22px;font-weight:750;letter-spacing:0;
  text-align:center;
}
.ring{position:relative;width:min(74vw,340px);aspect-ratio:1}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:#202732;fill:none;stroke-width:10}
.ring .bar{
  fill:none;stroke:var(--focus);stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset .2s linear,stroke .35s;
}
.ring .inner{
  position:absolute;inset:0;display:grid;place-content:center;
  gap:8px;padding:26px;text-align:center;
}
#time{
  font:750 clamp(44px,13vw,68px)/1 "SF Mono",ui-monospace,Consolas,monospace;
  letter-spacing:0;font-variant-numeric:tabular-nums;
}
#sub{color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{
  min-height:46px;padding:10px 22px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--txt);font:inherit;font-size:15px;font-weight:650;
  cursor:pointer;transition:background .15s,border-color .15s,transform .15s;
}
button:hover{border-color:#536174;background:#1b222c;transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.primary{background:#1f6feb;border-color:#1f6feb}
button.primary:hover{background:#2f7ff5;border-color:#2f7ff5}
button:focus-visible,input:focus-visible{
  outline:3px solid rgba(78,161,255,.38);outline-offset:2px;
}
.stats{
  display:flex;gap:clamp(20px,7vw,38px);justify-content:center;
  color:var(--dim);font-size:13px;text-align:center;
}
.stats b{
  display:block;color:var(--txt);font-size:20px;line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.opts{
  display:flex;gap:14px 18px;align-items:center;justify-content:center;flex-wrap:wrap;
  max-width:700px;color:var(--dim);font-size:13px;text-align:center;
}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.opts b{color:var(--txt);font-weight:600}
input[type=number]{
  width:62px;min-height:34px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--txt);font:inherit;text-align:center;
  font-variant-numeric:tabular-nums;
}
input[type=checkbox]{width:17px;height:17px;margin:0;accent-color:var(--focus)}
.dots{display:flex;gap:7px;min-height:9px}
.dots i{
  display:block;width:9px;height:9px;border-radius:50%;
  background:#252d38;transition:background .3s,box-shadow .3s;
}
.dots i.on{background:var(--long);box-shadow:0 0 9px rgba(245,165,36,.7)}
@media (max-width:520px){
  body{justify-content:flex-start;padding-top:28px}
  .ring{width:min(82vw,320px)}
  .stats{gap:18px}
  .opts{max-width:360px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<h1>STUDY COUNT · 专注循环</h1>
<div class="phase" id="phase" aria-live="polite">准备开始</div>

<div class="ring" id="timer" role="timer" aria-label="当前阶段剩余时间">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle class="track" cx="60" cy="60" r="54"></circle>
    <circle class="bar" id="bar" cx="60" cy="60" r="54"
      stroke-dasharray="339.29" stroke-dashoffset="0"></circle>
  </svg>
  <div class="inner">
    <div id="time">03:00</div>
    <div id="sub" aria-live="polite">点击开始</div>
  </div>
</div>

<div class="btns">
  <button class="primary" id="toggle" type="button">开始</button>
  <button id="skip" type="button">跳过</button>
  <button id="reset" type="button">重置</button>
</div>

<div class="dots" id="dots" aria-hidden="true"></div>

<div class="stats" aria-label="今日学习统计">
  <div><b id="cnt">0</b>今日学习段</div>
  <div><b id="mins">0</b>今日分钟</div>
  <div><b id="goal">0/90</b>本轮进度</div>
</div>

<div class="opts">
  <label>专注 <b>随机 3-5 分钟</b></label>
  <label>目标 <input type="number" id="oGoal" min="10" max="360" step="5" value="90"> 分</label>
  <label>回顾 <b>10 秒</b></label>
  <label>长休 <input type="number" id="oLong" min="5" max="120" step="5" value="20"> 分</label>
  <label><input type="checkbox" id="oSound" checked> 提示音</label>
  <label><input type="checkbox" id="oTitle" checked> 标题提醒</label>
</div>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var CIRC = 339.29;
  var STUDY_MIN_SEC = 180;
  var STUDY_MAX_SEC = 300;
  var RECALL_SEC = 10;
  var phase = 'study';
  var cycleStudyMs = 0;
  var total = 0;
  var remain = 0;
  var running = false;
  var hasStarted = false;
  var endAt = 0;
  var timerId = null;
  var flashId = null;
  var actx = null;
  var today = null;

  var goalInput = $('oGoal');
  var longInput = $('oLong');
  var soundInput = $('oSound');
  var titleInput = $('oTitle');

  function todayKey(){
    var d = new Date();
    return 'study_count_' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function load(){
    var fallback = {segments:0, ms:0, cycles:0, cycleStudyMs:0};
    try{
      var saved = JSON.parse(localStorage.getItem(todayKey()));
      if(!saved || typeof saved !== 'object') return fallback;
      return {
        segments:Number(saved.segments) || 0,
        ms:Number(saved.ms) || 0,
        cycles:Number(saved.cycles) || 0,
        cycleStudyMs:Number(saved.cycleStudyMs) || 0
      };
    }catch(error){
      return fallback;
    }
  }

  function save(){
    today.cycleStudyMs = cycleStudyMs;
    try{ localStorage.setItem(todayKey(), JSON.stringify(today)); }catch(error){}
  }

  function targetMs(){
    return Math.max(10, Math.min(360, Number(goalInput.value) || 90)) * 60 * 1000;
  }

  function randomStudyMs(){
    var remaining = Math.max(0, targetMs() - cycleStudyMs);
    if(remaining === 0) return 0;
    var span = STUDY_MAX_SEC - STUDY_MIN_SEC;
    var seconds = STUDY_MIN_SEC + Math.floor(Math.random() * (span + 1));
    return Math.min(seconds * 1000, remaining);
  }

  function phaseDuration(){
    if(phase === 'study') return randomStudyMs();
    if(phase === 'recall') return RECALL_SEC * 1000;
    return Math.max(5, Number(longInput.value) || 20) * 60 * 1000;
  }

  function phaseInfo(){
    if(phase === 'study'){
      return {
        label:'专注学习',
        color:'#4ea1ff',
        help:'本轮 ' + fmt(total) + ' · 已完成 ' + Math.floor(cycleStudyMs / 60000) + '/' +
          Math.round(targetMs() / 60000) + ' 分'
      };
    }
    if(phase === 'recall'){
      return {label:'闭眼回顾', color:'#39d98a', help:'闭上眼，快速回放刚才学到的内容'};
    }
    return {label:'长休息', color:'#f5a524', help:'离开屏幕，走动或补水'};
  }

  function fmt(ms){
    var seconds = Math.max(0, Math.ceil(ms / 1000));
    var minutes = Math.floor(seconds / 60);
    seconds %= 60;
    return (minutes < 10 ? '0' : '') + minutes + ':' +
      (seconds < 10 ? '0' : '') + seconds;
  }

  function render(){
    var info = phaseInfo();
    $('time').textContent = fmt(remain);
    $('phase').textContent = info.label;
    $('phase').style.color = info.color;
    $('sub').textContent = info.help;
    $('bar').style.stroke = info.color;
    var fraction = total > 0 ? Math.max(0, remain) / total : 0;
    $('bar').style.strokeDashoffset = (CIRC * (1 - fraction)).toFixed(2);
    $('timer').setAttribute('aria-label', info.label + '，剩余 ' + fmt(remain));
  }

  function renderStats(){
    $('cnt').textContent = today.segments;
    $('mins').textContent = Math.round(today.ms / 60000);
    var goalMinutes = Math.round(targetMs() / 60000);
    $('goal').textContent = Math.min(goalMinutes, Math.floor(cycleStudyMs / 60000)) +
      '/' + goalMinutes;

    var dots = $('dots');
    dots.replaceChildren();
    var progress = Math.min(1, cycleStudyMs / targetMs());
    for(var i = 1; i <= 10; i++){
      var dot = document.createElement('i');
      if(progress >= i / 10) dot.className = 'on';
      dots.appendChild(dot);
    }
  }

  function syncButton(){
    $('toggle').textContent = running ? '暂停' : (hasStarted ? '继续' : '开始');
  }

  function setPhase(nextPhase){
    phase = nextPhase;
    total = phaseDuration();
    remain = total;
    render();
    renderStats();
  }

  function ensureAudio(){
    if(!actx){
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if(AudioCtor) actx = new AudioCtor();
    }
    if(actx && actx.state === 'suspended') actx.resume();
    return actx;
  }

  function ding(count, gain){
    if(!soundInput.checked) return;
    var ctx = ensureAudio();
    if(!ctx) return;
    gain = gain || 0.4;
    for(var i = 0; i < count; i++){
      (function(index){
        setTimeout(function(){
          var start = ctx.currentTime;
          [[1180, 1], [2360, 0.32], [3540, 0.12]].forEach(function(pair){
            var oscillator = ctx.createOscillator();
            var volume = ctx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = pair[0];
            volume.gain.setValueAtTime(0, start);
            volume.gain.linearRampToValueAtTime(gain * pair[1], start + 0.008);
            volume.gain.exponentialRampToValueAtTime(0.0001, start + 1.5);
            oscillator.connect(volume);
            volume.connect(ctx.destination);
            oscillator.start(start);
            oscillator.stop(start + 1.6);
          });
        }, index * 420);
      })(i);
    }
  }

  function stopFlash(){
    if(flashId){
      clearInterval(flashId);
      flashId = null;
      document.title = 'Study Count · 专注循环计时器';
    }
  }

  function flashTitle(message){
    if(!titleInput.checked) return;
    stopFlash();
    var base = 'Study Count · 专注循环计时器';
    var count = 0;
    flashId = setInterval(function(){
      document.title = count++ % 2 ? base : '[提示] ' + message;
      if(count > 12) stopFlash();
    }, 500);
  }

  function advance(natural){
    if(phase === 'study'){
      if(natural){
        today.segments += 1;
        today.ms += total;
        cycleStudyMs += total;
        save();
      }
      setPhase('recall');
    }else if(phase === 'recall'){
      setPhase(cycleStudyMs >= targetMs() ? 'long' : 'study');
    }else{
      if(natural) today.cycles += 1;
      cycleStudyMs = 0;
      save();
      setPhase('study');
    }

    if(natural){
      ding(phase === 'study' ? 2 : 1, 0.48);
      flashTitle(phaseInfo().label);
    }
    if(running) endAt = Date.now() + remain;
    syncButton();
  }

  function tick(){
    remain = endAt - Date.now();
    if(remain <= 0){
      remain = 0;
      render();
      advance(true);
      return;
    }
    render();
  }

  function start(){
    if(remain <= 0) setPhase(phase);
    running = true;
    hasStarted = true;
    endAt = Date.now() + remain;
    clearInterval(timerId);
    timerId = setInterval(tick, 200);
    syncButton();
    ensureAudio();
  }

  function pause(){
    running = false;
    clearInterval(timerId);
    timerId = null;
    remain = Math.max(0, endAt - Date.now());
    syncButton();
    render();
  }

  function reset(){
    running = false;
    hasStarted = false;
    clearInterval(timerId);
    timerId = null;
    stopFlash();
    cycleStudyMs = 0;
    save();
    setPhase('study');
    syncButton();
  }

  $('toggle').addEventListener('click', function(){
    if(running) pause();
    else start();
  });
  $('skip').addEventListener('click', function(){ advance(false); });
  $('reset').addEventListener('click', reset);

  goalInput.addEventListener('change', function(){
    goalInput.value = Math.max(10, Math.min(360, Math.round(Number(goalInput.value) || 90)));
    if(cycleStudyMs >= targetMs()){
      running = false;
      clearInterval(timerId);
      timerId = null;
      setPhase('long');
      syncButton();
    }else if(phase === 'study' && !running){
      setPhase('study');
    }else{
      render();
      renderStats();
    }
  });

  longInput.addEventListener('change', function(){
    longInput.value = Math.max(5, Math.min(120, Math.round(Number(longInput.value) || 20)));
    if(phase === 'long' && !running) setPhase('long');
  });

  document.addEventListener('keydown', function(event){
    if(event.target && /INPUT|TEXTAREA/.test(event.target.tagName)) return;
    if(event.code === 'Space'){
      event.preventDefault();
      if(running) pause();
      else start();
    }
    if(event.key === 'r' || event.key === 'R') reset();
    if(event.key === 'n' || event.key === 'N') advance(false);
  });

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && running) tick();
  });

  today = load();
  cycleStudyMs = Math.min(today.cycleStudyMs, targetMs());
  phase = cycleStudyMs >= targetMs() ? 'long' : 'study';
  setPhase(phase);
  syncButton();
})();
</script>
</body>
</html>
